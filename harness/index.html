<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excalibur Benchmark</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1rem;
        color: #222;
      }
      #status {
        margin-bottom: 0.5rem;
      }
      #controls {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 0.75rem;
      }
      table {
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 0.25rem 0.5rem;
        text-align: right;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      canvas {
        border: 1px solid #ccc;
        display: block;
        margin-top: 0.75rem;
      }
      code {
        background: #f3f3f3;
        padding: 0 0.25rem;
      }
    </style>
  </head>
  <body>
    <h1>Excalibur Benchmark</h1>
    <div id="stage"></div>
    <div id="status">Loading…</div>
    <div id="controls" hidden>
      <label>Test <select id="test"></select></label>
      <label>Mode
        <select id="mode">
          <option value="step">deterministic steps</option>
          <option value="realtime">real-time fps</option>
        </select>
      </label>
      <label>Repeat <input id="repeat" type="number" min="1" max="10" value="1" style="width: 3rem" /></label>
      <button id="run">Run</button>
      <button id="runAll">Run all</button>
    </div>
    <table id="results" hidden>
      <thead>
        <tr>
          <th>Test</th>
          <th>Mode</th>
          <th>Median</th>
          <th>p95</th>
          <th>Mean</th>
          <th>Extras</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="charts"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
